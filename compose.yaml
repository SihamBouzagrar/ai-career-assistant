services:

  ai-career-assistant:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-career-assistant

    ports:
      - "8501:8501"

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:3b
      REQUEST_TIMEOUT: "120"

    volumes:
      - ./data:/app/data
      - ./reports:/app/reports

    restart: unless-stopped